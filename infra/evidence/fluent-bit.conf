[SERVICE]
    Flush              1
    Log_Level          warn
    Parsers_File       /fluent-bit/etc/evidence-parsers.conf
    storage.path       /buffers
    storage.sync       normal
    storage.checksum   on
    storage.backlog.mem_limit 5M

[INPUT]
    Name               tail
    Path               /fixtures/*.ndjson
    Tag                normalized.evidence
    Parser             normalized_json
    DB                 /buffers/evidence-tail.db
    Read_from_Head     true
    Refresh_Interval   1
    Buffer_Max_Size    64K
    Mem_Buf_Limit      5M
    Skip_Long_Lines    On
    storage.type       filesystem

[INPUT]
    Name               tail
    Path               /exports/traces.ndjson
    Tag                otel.traces
    Parser             normalized_json
    DB                 /buffers/trace-tail.db
    Read_from_Head     true
    Refresh_Interval   1
    Buffer_Max_Size    1M
    Mem_Buf_Limit      5M
    storage.type       filesystem

[OUTPUT]
    Name               opensearch
    Match              normalized.evidence
    Host               evidence-search
    Port               9200
    HTTP_User          evidence_writer
    HTTP_Passwd        ${EVIDENCE_WRITER_PASSWORD}
    Index              investinator-evidence
    Pipeline           investinator-evidence-validation
    Suppress_Type_Name On
    Id_Key             evidence_id
    Write_Operation    create
    Retry_Limit        5
    Buffer_Size        256K
    storage.total_limit_size 100M

[OUTPUT]
    Name               opensearch
    Match              otel.traces
    Host               evidence-search
    Port               9200
    HTTP_User          evidence_writer
    HTTP_Passwd        ${EVIDENCE_WRITER_PASSWORD}
    Index              investinator-traces
    Suppress_Type_Name On
    Generate_ID        On
    Write_Operation    create
    Retry_Limit        5
    Buffer_Size        256K
    storage.total_limit_size 100M
