name: One-time Next.js security repair and local smoke check
on:
  push:
    branches:
      - fix/nextjs-security-2026-11-17
    paths:
      - .github/workflows/one-time-nextjs-repair.yml

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate patched Next.js manifest and lockfile from npm
        working-directory: apps/web
        run: |
          npm install next@16.4.5 --save-exact
          npm audit fix
          npm ci
          node -e "const p=require('./node_modules/next/package.json');if(p.version!=='16.4.5')throw Error('Wrong Next.js version: '+p.version);console.log('Verified Next.js:',p.version)"
      - name: Enforce the existing security gate
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: Check frontend build
        working-directory: apps/web
        run: npm run build
      - name: Commit patched package manifest and lockfile to fix branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(security): patch Next.js to 16.4.5 and update npm lockfile"
            git push origin HEAD:refs/heads/fix/nextjs-security-2026-11-17
          else
            echo "Package manifest and lockfile already up to date"
          fi
      - name: Build and start complete Docker Compose project
        run: docker compose up --build -d
      - name: Verify backend and frontend process startup
        run: |
          for i in $(seq 1 36); do
            if curl --fail --silent http://127.0.0.1:8000/health >/dev/null && curl --fail --silent http://127.0.0.1:3000/ >/dev/null; then
              echo "API and web responded to live HTTP probes"
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=80 api web
          exit 1
      - name: Run end-to-end demo smoke test
        run: |
          python -m pip install -e '.[dev]'
          python scripts/smoke_demo.py
      - name: Print container statuses after smoke
        if: always()
        run: docker compose ps || true
      - name: Clean up temporary CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans || true
