name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: pytest -q
      - run: ruff check src tests scripts/investinator_cli.py scripts/verify_health_lab.py scripts/verify_connectors_lab.py tests_cli
      - run: python -m unittest discover -s tests_cli
      - run: mypy src
      - run: python -m incident_copilot.evaluation eval/test_incidents.jsonl
      - run: docker compose config --quiet
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --audit-level=high
  java-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend-java/pom.xml
      - run: ./backend-java/mvnw -B -f backend-java/pom.xml verify
      - run: docker compose -f docker-compose.yml -f compose.java.yaml --profile java config --quiet
      - run: docker compose -p investinator-java-ci -f docker-compose.yml -f compose.java.yaml --profile java up --build --no-deps --wait --wait-timeout 90 java-api
      - run: python3 backend-java/scripts/smoke.py
      - run: python3 backend-java/scripts/evidence_lab.py verify
      - if: always()
        run: docker compose -p investinator-java-ci -f docker-compose.yml -f compose.java.yaml --profile java logs --no-color java-api
      - if: always()
        run: docker compose -p investinator-java-ci -f docker-compose.yml -f compose.java.yaml --profile java stop java-api
